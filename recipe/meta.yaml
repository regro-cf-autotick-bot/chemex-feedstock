{% set name = "chemex" %}
{% set version = "2026.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/chemex-{{ version }}.tar.gz
  sha256: 28be450d6f0bbac0d1ef69e3ba53fedcc8bbd88656b5eb8c319586ea4dab7d23

build:
  entry_points:
    - chemex = chemex.chemex:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.12
    - hatchling
    - pip
  run:
    - python >=3.12
    - annotated-types
    - cachetools
    - emcee
    - lmfit
    - matplotlib-base
    - numdifftools
    - numpy
    - pydantic
    - rapidfuzz
    - rich
    - scipy

test:
  imports:
    - chemex
  commands:
    - pip check
    - chemex --help
  requires:
    - pip

about:
  summary: An analysis program for chemical exchange detected by NMR
  license: GPL-3.0-only
  license_file: LICENSE.md
  home: https://github.com/gbouvignies/ChemEx

extra:
  recipe-maintainers:
    - gbouvignies
