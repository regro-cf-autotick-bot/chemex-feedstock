schema_version: 1

context:
  python_min: "3.13"
  version: "2026.9.0"

package:
  name: chemex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/chemex/chemex-${{ version }}.tar.gz
  sha256: 7c5634e7a2a1d8577d7897dfb381a037ee23c86a9494bea3f697181a9dda52cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - chemex = chemex._entrypoint:main

requirements:
  host:
    - python ${{ python_min }}.*
    - uv_build >=0.8.14,<0.13.0
    - pip
  run:
    - python >=${{ python_min }}
    - annotated-types >=0.7.0
    - cachetools >=5.5.1
    - emcee >=3.1.6
    - matplotlib-base >=3.10.0
    - numpy >=2.2.3
    - pydantic >=2.10.6
    - rapidfuzz >=3.12.1
    - rich >=13.9.4
    - scipy >=1.18,<1.19

tests:
  - python:
      imports:
        - chemex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - chemex --help

about:
  summary: An analysis program for chemical exchange detected by NMR
  license: GPL-3.0-only
  license_file: LICENSE.md
  homepage: https://gbouvignies.github.io/ChemEx/
  documentation: https://gbouvignies.github.io/ChemEx/

extra:
  recipe-maintainers:
    - ocefpaf
